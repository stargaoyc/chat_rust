[package]
name = "chat-server"
version = "0.1.0"
authors = ["stargaoyc"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = {workspace = true}
argon2 = { version = "0.5.3", features = ["std"] }
axum = {workspace = true}
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = { version = "0.4.44", features = ["serde"] }
hex = "0.4.3"
jwt-simple = { version = "0.12.16", default-features = false, features = ["pure-rust"] }
mime_guess = "2.0.5"
serde = {workspace = true}
serde_json = "1.0.150"
serde_yaml = {workspace = true}
sha2 = "0.11.0"
sqlx = {workspace = true}
thiserror = {workspace = true}
tokio = {workspace = true}
tokio-util = { version = "0.7.18", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["compression-full", "cors", "trace", "fs"] }
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
uuid = { version = "1.23.3", features = ["v7", "serde"] }
