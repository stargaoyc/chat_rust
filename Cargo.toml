[workspace]
members = ["chat_core",
    "chat_server", "chat_test", "notify_server",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["http2", "multipart", "query", "tracing"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "macros", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "net", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4.44", features = ["serde"] }
chat_core = {path = "./chat_core"}
chat_server ={ path = "./chat_server"}
notify_server ={ path = "./notify_server"}
jwt-simple = { version = "0.12.16", default-features = false, features = ["pure-rust"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["compression-full", "cors", "trace", "fs", "limit"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
